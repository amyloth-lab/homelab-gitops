apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-config
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: "git@github.com:amyloth-lab/homelab-gitops.git"
    targetRevision: main
    path: infrastructure/longhorn
    directory:
      exclude: "values.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
