apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homepage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/this-is-tobi/charts
      chart: homepage
      targetRevision: 0.3.0
      helm:
        valueFiles:
          - $values/apps/homepage/values.yaml
    - repoURL: git@github.com:amyloth-lab/homelab-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: homepage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
