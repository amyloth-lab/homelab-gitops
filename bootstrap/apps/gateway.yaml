apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homelab-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "git@github.com:amyloth-lab/homelab-gitops.git"
    targetRevision: main
    path: infrastructure/gateway
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
