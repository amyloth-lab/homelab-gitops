apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "git@github.com:amyloth-lab/homelab-gitops.git"
    targetRevision: main
    path: infrastructure/cert-manager
    directory:
      include: "cluster-issuer.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
