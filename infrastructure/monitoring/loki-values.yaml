loki:
  enabled: true
  persistence:
    enabled: true
    storageClassName: longhorn
    size: 15Gi
  config:
    table_manager:
      retention_deletes_enabled: true
      retention_period: 168h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

promtail:
  enabled: true
  config:
    clients:
      - url: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

grafana:
  enabled: false
prometheus:
  enabled: false
